services:
  mongodb-test:
    image: mongo:7
    ports:
      - '27018:27017'
    tmpfs:
      - /data/db
    healthcheck:
      test: mongosh --eval "db.runCommand('ping').ok" --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    image: node:24.22.2-slim
    # The repository root is mounted so the DV-05 structural test can read every Node pin.
    working_dir: /repo/backend
    volumes:
      - .:/repo
      - backend_node_modules:/repo/backend/node_modules
    depends_on:
      mongodb-test:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb-test:27017/auctions-test
      JWT_SECRET: test-secret
      PORT: 3000
      IMPORT_ENABLED: 'false'
      SCRAPER_ENABLED: 'false'
      REMINDERS_ENABLED: 'false'
    command: npm test

  frontend-test:
    image: node:24.22.2-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm test

volumes:
  backend_node_modules:
  frontend_node_modules:
