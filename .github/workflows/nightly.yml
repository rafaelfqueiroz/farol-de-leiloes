# DEVELOPMENT §12. The full advisory list (every severity, dev dependencies included) goes to the
# run summary; the job fails only at high or above (SC-19), so a scheduled-run failure email is
# the alert for a new high advisory on code nobody has pushed. BL-002's performance budgets join
# here later. GitHub disables scheduled workflows after 60 days without repository activity.
name: Nightly

on:
  schedule:
    # 06:17 UTC = 03:17 in Brasília.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Full advisory list
        run: |
          for pkg in backend frontend; do
            {
              echo "## npm audit — $pkg"
              echo '```'
              (cd "$pkg" && npm audit) || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() }}
        working-directory: frontend
