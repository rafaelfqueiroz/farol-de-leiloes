# SC-19: CodeQL runs on every PR. The job id `codeql` is a required status check, and the
# ruleset's code_scanning rule blocks a merge on a new high or critical alert (DEVELOPMENT §12).
# Advanced setup: the repository's CodeQL "default setup" stays off, because the two conflict.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new queries run against code nobody has touched.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/coverage/**'
              - '**/dist/**'
              - '**/.next/**'
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
