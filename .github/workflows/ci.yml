# DEVELOPMENT §12. Every job below is a required status check on `main` (DV-27), under its job id
# (`images` under its names, `backend-image` and `frontend-image`); renaming one means updating
# the ruleset in the same change. SC-21: every action is pinned to a commit SHA with its version
# in a comment, permissions are least privilege, and there is no `pull_request_target`. The
# structural suite (test/structural/workflows.spec.ts) enforces it.
# `e2e` joins with #3; until it exists it is not a required check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A superseded PR push stops; runs on `main` always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # npm 11 skips puppeteer's install script anyway; no CI job drives a browser (ARCHITECTURE).
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Unit + structural with the coverage gate (TESTING §7).
      - run: npm run test:cov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Testcontainers MongoDB on the runner's Docker (DV-17, TESTING §2 and §4).
      - run: npm run test:integration
      - run: npm run test:isolation

  backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:cov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # SC-19: a high or critical advisory blocks. `npm audit` reads the lockfile, so no install.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm audit --audit-level=high
        working-directory: backend
      # Runs even when the backend audit fails, so one run reports both packages.
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() }}
        working-directory: frontend

  # Checks on the repository itself: Node pinned everywhere (DV-05), workflows pinned and
  # least privilege (SC-21), Dockerfiles and .dockerignore (SC-16), the pre-push selection
  # (DV-37). Also part of backend-test; a job of its own so the check names what failed.
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:structural

  # Proves the Dockerfiles, `.dockerignore` and Next's standalone output build before merge;
  # deploy.yml is what publishes. Nothing is pushed and nothing logs in to a registry, so a PR
  # (forks included) gets `contents: read` and no secrets. No build cache, as in deploy.yml:
  # the build is what is being proven, and a cache would let an earlier run hide a break.
  images:
    name: ${{ matrix.package }}-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            build-args: ''
          - package: frontend
            # Public values only (SC-16): NEXT_PUBLIC_* is inlined into the browser bundle.
            build-args: |
              NEXT_PUBLIC_AUCTIONS_API_URL=${{ vars.NEXT_PUBLIC_AUCTIONS_API_URL }}
              NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.package }}
          push: false
          build-args: ${{ matrix.build-args }}
