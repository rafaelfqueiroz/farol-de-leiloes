# DEVELOPMENT §12. There is no deploy target yet (BL-001, #40): this workflow proves the images
# build on every push to `main` and publishes them to GHCR tagged with the full commit SHA
# (DV-33). `preflight` is gated on the DEPLOY_ENABLED repository variable (DV-36).
#
# Not here yet, and added with BL-001: the gated migration step before the new code starts
# (DV-34), the rollout, the `GET /api/health` check (AR-48) and rollback by redeploying a
# previous SHA.
#
# No npm or build cache in a publishing workflow, so a poisoned cache cannot reach an image.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.package }}
          push: true
          # Full SHA only, never `latest` (DV-33).
          tags: ghcr.io/${{ github.repository }}-${{ matrix.package }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Public values only (SC-16): NEXT_PUBLIC_* is inlined into the browser bundle. The
          # backend Dockerfile declares no build args, so these only reach the frontend.
          build-args: |
            NEXT_PUBLIC_AUCTIONS_API_URL=${{ vars.NEXT_PUBLIC_AUCTIONS_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}

  # DV-36: DEPLOY_ENABLED unset → this job is skipped and the run stays green. Set → every deploy
  # secret must be present, or the job fails loudly. Deploy secrets live in the `deploy-production`
  # environment (DV-35).
  preflight:
    needs: images
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: deploy-production
    permissions: {}
    steps:
      - name: Deploy secrets are present
        # The deploy secrets are mapped into env here once the target exists (BL-001), and each
        # is checked with `[ -n "$NAME" ]`; values are never printed.
        run: |
          echo "::error::DEPLOY_ENABLED is set but no deploy target exists yet (BL-001, #40)"
          exit 1
