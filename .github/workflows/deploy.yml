# DEVELOPMENT §12. `images` publishes both images to GHCR on every push to `main`, tagged with the
# full commit SHA (DV-33); ci.yml builds the same images on every PR without pushing.
#
# With the DEPLOY_ENABLED repository variable unset, `preflight` and `deploy` are skipped and the
# run stays green (DV-36). Set, `preflight` checks the deploy secrets and the runtime configuration
# of the `deploy-production` environment (DV-35, ADR-004) and `deploy` releases the commit to the
# VPS (ADR-002) over SSH as `deploy`, automating docs/runbooks/deploy-and-rollback.md through
# deploy/release.sh: the env files rendered from the environment's secrets and variables
# (deploy/render-env.sh) installed with the compose file and Caddyfile, pull, the gated migration
# (DV-34, a failure stops with the running version and its files untouched), the single backend
# replaced, `GET /api/health` from the runner (AR-48), and on failure an automatic rollback to the
# previous SHA and its files without migrations (DV-33, AR-28), after which the job still fails.
# The first deploy is a `workflow_dispatch` run on `main`.
#
# The workflow-level concurrency group queues runs, so two deploys never overlap.
#
# No npm or build cache in a publishing workflow, so a poisoned cache cannot reach an image.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            build-args: ''
          - package: frontend
            # Public values only (SC-16): NEXT_PUBLIC_* is inlined into the browser bundle.
            build-args: |
              NEXT_PUBLIC_AUCTIONS_API_URL=${{ vars.NEXT_PUBLIC_AUCTIONS_API_URL }}
              NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
              NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.package }}
          push: true
          # Full SHA only, never `latest` (DV-33).
          tags: ghcr.io/${{ github.repository }}-${{ matrix.package }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.build-args }}

  # DV-36: DEPLOY_ENABLED unset → this job and `deploy` are skipped and the run stays green. Set →
  # every deploy secret and every required runtime value must be present, or the job fails loudly.
  # Both live in the `deploy-production` environment (DV-35, ADR-004). Only `main` deploys.
  preflight:
    needs: images
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: deploy-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ADR-004: the runtime configuration, mapped one by one from the environment's secrets
      # (secret values) and variables (the rest). The same mapping feeds the render step of
      # `deploy` through the YAML anchor. A name added here must also be in deploy/render-env.sh
      # and backend/.env.example; test/structural/deploy-config.spec.ts checks all three. Only the
      # two steps that run render-env.sh see these values, which it never prints (SC-16).
      - name: Runtime configuration is complete
        env: &runtime-config
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          TRUST_PROXY_HOPS: ${{ vars.TRUST_PROXY_HOPS }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_STANDARD_PRICE_ID: ${{ vars.STRIPE_STANDARD_PRICE_ID }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_PROVIDER_API_KEY: ${{ secrets.SMS_PROVIDER_API_KEY }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          IMPORT_ENABLED: ${{ vars.IMPORT_ENABLED }}
          IMPORT_ON_START_UP: ${{ vars.IMPORT_ON_START_UP }}
          SCRAPER_ENABLED: ${{ vars.SCRAPER_ENABLED }}
          SCRAPER_ON_START_UP: ${{ vars.SCRAPER_ON_START_UP }}
          REMINDERS_ENABLED: ${{ vars.REMINDERS_ENABLED }}
          CLEANUP_ON_STARTUP: ${{ vars.CLEANUP_ON_STARTUP }}
          NEIGHBORHOODS_CACHE_ENABLED: ${{ vars.NEIGHBORHOODS_CACHE_ENABLED }}
          NEIGHBORHOODS_CACHE_TTL: ${{ vars.NEIGHBORHOODS_CACHE_TTL }}
          SAVED_FILTERS_MAX_PER_USER: ${{ vars.SAVED_FILTERS_MAX_PER_USER }}
          UNAVAILABLE_AUCTION_RETENTION_DAYS: ${{ vars.UNAVAILABLE_AUCTION_RETENTION_DAYS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LOG_HASH_SECRET: ${{ secrets.LOG_HASH_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash deploy/render-env.sh check

      - name: Deploy secrets and variables are present
        # Runs after a failed runtime check too, so one run lists everything missing.
        if: ${{ !cancelled() }}
        # Values are never printed (SC-16); only the public URLs may appear in a message.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_URL: ${{ vars.NEXT_PUBLIC_AUCTIONS_API_URL }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing from the deploy-production environment (DV-36)"
              missing=1
            fi
          done
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_AUCTIONS_API_URL is not set"
            missing=1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_SITE_URL is not set"
            missing=1
          fi
          # A bare host name or IPv4 address: it is written into an SSH config file.
          if [ -n "$DEPLOY_HOST" ] && ! [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST must be a bare host name or address (no user, port or spaces)"
            missing=1
          fi
          # Same shape as the runbook: https, no trailing slash, no /api.
          if [ -n "$API_URL" ] && ! [[ "$API_URL" =~ ^https://[^/]+$ ]]; then
            echo "::error::NEXT_PUBLIC_AUCTIONS_API_URL must be https://<api-host>, without a path or trailing slash"
            missing=1
          fi
          exit "$missing"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    # Deploy, health check and rollback each have their own bound below.
    timeout-minutes: 45
    environment:
      name: deploy-production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      RELEASE_SHA: ${{ github.sha }}
      API_URL: ${{ vars.NEXT_PUBLIC_AUCTIONS_API_URL }}
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release SHA is a full commit SHA
        run: |
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Not a full commit SHA: $RELEASE_SHA (DV-33)"
            exit 1
          fi

      # ADR-004: caddy.env, frontend.env and backend.env, in a directory only this user can read
      # (700, files 600), removed by the last step. Values are checked again and never printed.
      - name: Render the runtime configuration
        env: *runtime-config
        run: |
          bash deploy/render-env.sh render "$RUNNER_TEMP/farol-env"
          echo "ENV_DIR=$RUNNER_TEMP/farol-env" >>"$GITHUB_ENV"

      # Plain OpenSSH, no third-party action. The key and the pinned host key go to files only
      # this user can read, removed by the last step; host keys are never learnt at deploy time
      # (no ssh-keyscan, StrictHostKeyChecking=yes).
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          umask 077
          mkdir -p "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$ssh_dir/id"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$ssh_dir/known_hosts"
          cat >"$ssh_dir/config" <<EOF
          Host farol
            HostName $DEPLOY_HOST
            User deploy
            IdentityFile $ssh_dir/id
            IdentitiesOnly yes
            UserKnownHostsFile $ssh_dir/known_hosts
            GlobalKnownHostsFile /dev/null
            StrictHostKeyChecking yes
            UpdateHostKeys no
            CheckHostIP no
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
            LogLevel ERROR
          EOF
          chmod 600 "$ssh_dir/id" "$ssh_dir/known_hosts" "$ssh_dir/config"
          # Fails on a malformed or passphrase-protected key without printing it.
          if ! ssh-keygen -y -f "$ssh_dir/id" >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a usable private key without a passphrase"
            exit 1
          fi
          if ! ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null 2>&1; then
            echo "::error::DEPLOY_KNOWN_HOSTS holds no valid known_hosts line"
            exit 1
          fi
          echo "SSH_CONFIG=$ssh_dir/config" >>"$GITHUB_ENV"

      # Runbook step 1: the running SHA, to roll back to. The server copy of release.sh is never
      # used: the script travels on stdin with each call. The env files travel inside the SSH
      # connection (scp), never on a command line, into /srv/farol/.incoming/env (mode 700).
      - name: Record the running release
        id: prepare
        run: |
          previous="$(ssh -F "$SSH_CONFIG" farol bash -s -- prepare <deploy/release.sh)"
          if [ -n "$previous" ] && ! [[ "$previous" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected running release from the server"
            exit 1
          fi
          echo "Running release: ${previous:-none (first deploy)}"
          echo "previous=$previous" >>"$GITHUB_OUTPUT"
          scp -F "$SSH_CONFIG" -q deploy/compose.production.yml deploy/Caddyfile farol:/srv/farol/.incoming/
          scp -F "$SSH_CONFIG" -q "$ENV_DIR/caddy.env" "$ENV_DIR/frontend.env" "$ENV_DIR/backend.env" \
            farol:/srv/farol/.incoming/env/

      # Runbook steps 2 to 5 on the server. Exit code 1 means the backend was not touched, so
      # there is nothing to roll back; any other failure (2, a dropped connection, a timeout) may
      # have replaced it.
      - name: Deploy ${{ github.sha }}
        id: deploy
        timeout-minutes: 15
        run: |
          rc=0
          ssh -F "$SSH_CONFIG" farol bash -s -- deploy "$RELEASE_SHA" <deploy/release.sh || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "replaced=false" >>"$GITHUB_OUTPUT"
          else
            echo "replaced=true" >>"$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # AR-48 from outside, through Caddy and TLS: 200 is ok or degraded (serving), 503 is down
      # (docs/runbooks/health-check.md). The site must answer 200 too.
      - name: Health check
        id: health
        timeout-minutes: 5
        run: bash deploy/check-health.sh

      - name: Roll back to the previous release
        id: rollback
        if: >-
          ${{ failure() && (steps.health.outcome == 'failure'
          || (steps.deploy.outcome == 'failure' && steps.deploy.outputs.replaced != 'false')) }}
        timeout-minutes: 15
        env:
          PREVIOUS_SHA: ${{ steps.prepare.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS_SHA" ]; then
            echo "::error::Release $RELEASE_SHA failed and there is no previous release to roll back to; the site may be down"
            exit 1
          fi
          echo "::warning::Release $RELEASE_SHA failed; rolling back to $PREVIOUS_SHA without migrations (DV-33, AR-28)"
          ssh -F "$SSH_CONFIG" farol bash -s -- rollback "$PREVIOUS_SHA" <deploy/release.sh
          bash deploy/check-health.sh
          echo "::error::Release $RELEASE_SHA failed and was rolled back to $PREVIOUS_SHA. Open an issue with what failed (runbook)"
          exit 1

      - name: Remove the SSH key and the rendered configuration
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/deploy-ssh" "$RUNNER_TEMP/farol-env"
